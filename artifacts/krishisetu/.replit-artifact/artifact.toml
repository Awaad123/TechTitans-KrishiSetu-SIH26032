kind = "web"
previewPath = "/"
title = "KrishiSetu"
description = "A heritage-inspired farmer procurement scheduling platform for booking slots, managing digital tokens, tracking queue position, procurement progress, and payment status, with an admin operations dashboard."
version = "1.0.0"
id = "artifacts/krishisetu"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21594

[services.development]
run = "pnpm --filter @workspace/krishisetu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/krishisetu", "run", "build" ]
serve = "static"
publicDir = "artifacts/krishisetu/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21594"
BASE_PATH = "/"
